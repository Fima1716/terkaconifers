name: Deploy to production

on:
  push:
    branches: [main]

env:
  SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Check server is reachable
        run: |
          host='${{ secrets.SSH_HOST }}'
          if [ -z "$host" ]; then echo "::error::secrets.SSH_HOST пуст"; exit 1; fi
          if ! nc -z -w 20 "$host" 22; then
            echo "::error::Сервер не отвечает на порту 22 — проверьте SSH_HOST и файрвол"
            exit 1
          fi
          echo "Порт 22 открыт"

      - name: Deploy files
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.nuxt' \
            --exclude='data/' \
            --exclude='public/photos' \
            --exclude='public/banner/' \
            --exclude='public/data/' \
            --exclude='logs/' \
            --exclude='.env' \
            -e "ssh $SSH_OPTS" \
            ./ root@${{ secrets.SSH_HOST }}:/var/www/terka/

      - name: Install, build & restart
        run: |
          ssh $SSH_OPTS root@${{ secrets.SSH_HOST }} 'cd /var/www/terka && npm install --production && npx nuxi build && pm2 restart ecosystem.config.cjs'
